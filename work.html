<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>作品｜Luva 整合行銷團隊</title>
<link rel="icon" type="image/png" href="https://luvateam.com/favicon.png">
<!-- Worker 會在 head 結尾前注入：description、og:*、canonical，以及 work-data（作品資料的 JSON） -->
<link rel="stylesheet" href="https://my-font-cdn.ivy2270.workers.dev/UoqMunThenKhung/result.css">
<link rel="stylesheet" href="https://my-font-cdn.ivy2270.workers.dev/ChenYuluoyan/result.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js" crossorigin="anonymous" defer></script>
<style>
:root{
  --g:#7BA643;--gl:#A0C661;--gd:#2A6242;--gb:#377D47;--gt:#DEEDC2;--ac:#F28B6D;
  --bg:#FBFAF5;--tx:#24332A;--soft:#5E6B62;--card:#fff;--head:#2A6242;
  --f-title:"UoqMunThenKhung","Noto Serif TC",serif;--f-hand:"ChenYuluoyan 2.0 Thin","Noto Serif TC",cursive;--f-body:"Noto Sans TC",system-ui,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121A15;--tx:#E9F1E3;--soft:#A9B8AC;--card:#1B2620;--head:#CFE8B0;--gt:#22301F}}
:root[data-theme="dark"]{--bg:#121A15;--tx:#E9F1E3;--soft:#A9B8AC;--card:#1B2620;--head:#CFE8B0;--gt:#22301F}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.75 var(--f-body);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4{font-family:var(--f-title);color:var(--head);line-height:1.3;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--gb);color:#fff;padding:12px 26px;border-radius:99px;font-weight:500;transition:transform .2s,background .2s}
.btn:hover{transform:translateY(-2px) rotate(-1deg);background:var(--gd)}
a:focus-visible,.btn:focus-visible{outline:3px solid var(--ac);outline-offset:3px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:68px}
.logo-img{display:block;height:46px;width:auto;max-width:62vw;object-fit:contain}
@media(min-width:1100px){.logo-img{height:52px}}
@media(max-width:899px){.logo-img{height:38px}}
header .back{font-size:15px;color:var(--soft)}header .back:hover{color:var(--head)}
/* 詳細頁 */
.top{padding:36px 0 10px;max-width:820px}
.tag{display:inline-block;background:var(--gt);color:#24332A;font-size:13px;font-weight:500;padding:2px 14px;border-radius:99px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.top h1{font-size:clamp(30px,5.5vw,52px);margin:14px 0 12px}
.sum{font-size:18px;color:var(--soft);margin:0 0 18px;white-space:pre-line}
.meta{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:14px;color:var(--soft);margin:0}
.meta b{color:var(--head);font-weight:500;margin-right:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{background:var(--gt);color:var(--head);border-radius:99px;padding:0 12px;font-size:13px}
.cover{position:relative;margin:30px 0 0;aspect-ratio:16/9;border-radius:36px 36px 120px 36px;overflow:hidden;background:linear-gradient(135deg,#7BA643,#2A6242);box-shadow:0 18px 40px rgba(20,40,25,.2)}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
@media(max-width:700px){.cover{border-radius:26px 26px 70px 26px}}
.prose{max-width:760px;margin:44px auto 0;font-size:17px;line-height:1.9}
[data-type="攝影影音"] .prose{max-width:980px}
.prose h2{font-size:28px;margin:2em 0 .6em}.prose h3{font-size:22px;margin:1.6em 0 .5em}.prose h4{font-size:18px;margin:1.4em 0 .4em}
.prose p{margin:0 0 1.2em}.prose a{color:var(--gb);text-decoration:underline}
.prose figure{margin:1.8em 0}.prose img{width:100%;height:auto;display:block;border-radius:22px}
.prose figcaption{text-align:center;color:var(--soft);font-size:14px;margin-top:8px}
.prose blockquote{margin:1.6em 0;padding:4px 22px;border-left:4px solid var(--ac);font:400 22px/1.7 var(--f-hand);color:var(--head)}
.prose hr{border:0;border-top:2px dashed var(--g);margin:2.4em 0}
.prose aside.callout{display:flex;gap:12px;background:var(--gt);border-radius:20px;padding:16px 20px;margin:1.6em 0}
.prose pre{background:var(--card);padding:14px 18px;border-radius:14px;overflow-x:auto}
.prose .cols{display:grid;gap:16px;margin:1.8em 0}.prose .cols figure{margin:0}
@media(min-width:700px){.prose .cols{grid-auto-flow:column;grid-auto-columns:1fr}}
.prose .col{display:grid;gap:16px;align-content:start}
.video{position:relative;aspect-ratio:16/9;border-radius:22px;overflow:hidden;margin:1.8em 0;background:#000}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.act{max-width:760px;margin:30px auto 0;display:flex;flex-wrap:wrap;gap:12px}
.msg{padding:80px 0;text-align:center;color:var(--soft)}
.cta{background:var(--g);color:#14261b;text-align:center;border-radius:60px 60px 0 0;padding:60px 20px 80px;margin-top:70px}
.cta h2{color:#14261b;font-size:clamp(26px,5vw,38px)}.cta .btn{margin-top:22px;background:#14261b}
footer{background:var(--g);color:#14261b;text-align:center;font-size:13px;padding:0 20px 28px}
.fl{position:fixed;right:18px;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:25;width:58px;height:58px;display:grid;place-items:center;font-size:32px;background:#06C755;color:#fff;border-radius:50%;box-shadow:0 8px 20px rgba(0,0,0,.25);transition:opacity .3s,transform .3s}
@supports (height:100svh){.fl{bottom:auto;top:calc(100svh - 82px - env(safe-area-inset-bottom,0px))}}
@media(min-width:900px){.fl{top:auto;bottom:24px;right:24px}}
.fl:hover{transform:scale(1.08) rotate(-8deg)}.fl.hide{opacity:0;transform:translateY(20px);pointer-events:none}
.prose img{cursor:zoom-in}
/* 燈箱 */
.lb{position:fixed;inset:0;z-index:100;background:rgba(10,18,13,.94);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .25s}
.lb[hidden]{display:none}.lb [hidden]{display:none!important}
.lb.on{opacity:1}
.lb-f{margin:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 72px 70px}
.lb-f img{display:block;max-width:100%;max-height:calc(100vh - 170px);max-height:calc(100dvh - 170px);width:auto;height:auto;object-fit:contain;border-radius:8px;user-select:none;-webkit-user-drag:none}
.lb-f figcaption{color:#e9f1e3;font-size:14px;line-height:1.6;margin-top:12px;text-align:center;max-width:70ch}
.lb button{position:absolute;width:46px;height:46px;border:0;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font:400 28px/1 var(--f-body);cursor:pointer;display:grid;place-items:center;transition:background .2s}
.lb button:hover{background:rgba(255,255,255,.24)}.lb button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.lb-x{top:calc(14px + env(safe-area-inset-top,0px));right:14px}
.lb-p{left:14px;top:50%;transform:translateY(-50%)}.lb-nx{right:14px;top:50%;transform:translateY(-50%)}
.lb-c{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));text-align:center;color:#cfe0c9;font-size:13px;letter-spacing:.1em}
@media(max-width:700px){.lb-f{padding:60px 10px 76px}.lb-p,.lb-nx{width:38px;height:38px;font-size:24px;background:rgba(255,255,255,.1)}.lb-p{left:6px}.lb-nx{right:6px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<path id="lf" d="M0 0C-13-3-17-20-7-23-2-24 0-19 0-15 0-19 2-24 7-23 17-20 13-3 0 0Z"/>
<symbol id="cl" viewBox="-26 -26 52 52"><g fill="currentColor"><use href="#lf"/><use href="#lf" transform="rotate(90)"/><use href="#lf" transform="rotate(180)"/><use href="#lf" transform="rotate(270)"/></g></symbol>
</defs></svg>

<header><div class="wrap">
  <a class="logo" href="/" aria-label="Luva 整合行銷團隊">
    <!-- ▼ LOGO：和首頁用同一個 SVG（貼上你的 logo 內容） -->
    <img class="logo-img" src="/logo.svg" alt="Luva 整合行銷團隊" width="580" height="98">
  </a>
  <a class="back" href="/#works">← 全部作品</a>
</div></header>

<main>
  <article class="wrap" id="app"><p class="msg">載入中…</p></article>
  <div class="cta" id="contact">
    <h2>想做一場這樣的活動？</h2>
    <p>用 LINE 告訴我們你的想法，我們會盡快回覆。</p>
    <a class="btn" href="https://lin.ee/sUsuzPj" rel="noopener"><i class="fa-brands fa-line"></i>加入 LINE 諮詢</a>
  </div>
</main>
<footer><p>© Luva 整合行銷團隊　版權所有</p></footer>
<a class="fl" id="fl" href="https://lin.ee/sUsuzPj" rel="noopener" aria-label="LINE 諮詢"><i class="fa-brands fa-line"></i></a>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="圖片檢視" hidden>
  <button class="lb-x" type="button" aria-label="關閉">×</button>
  <button class="lb-p" type="button" aria-label="上一張">‹</button>
  <figure class="lb-f"><img alt=""><figcaption></figcaption></figure>
  <button class="lb-nx" type="button" aria-label="下一張">›</button>
  <div class="lb-c" aria-live="polite"></div>
</div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// 本機或 github.io 預覽時，API 在 workers.dev；正式網站和 API 同網域
const API=/^(localhost|127\.0\.0\.1)$|\.github\.io$/.test(location.hostname)?'https://luvateam.com':'';
const slug=new URLSearchParams(location.search).get('slug')||(location.pathname.match(/\/works\/([a-z0-9-]+)/)||[])[1];

function show(w){
  document.title=`${w.title}｜Luva 整合行銷團隊`;
  document.body.dataset.type=w.type||'';
  const date=w.date?w.date.slice(0,10).replace(/-/g,'.'):'';
  const tags=w.tags||w.services||(w.type?[w.type]:[]);
  const meta=[date&&`<div><b>日期</b>${esc(date)}</div>`,w.client&&`<div><b>客戶</b>${esc(w.client)}</div>`].filter(Boolean).join('');
  $('#app').innerHTML=`<div class="top">${tags.length?`<div class="tags">${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`:''}<h1>${esc(w.title)}</h1>${w.summary?`<p class="sum">${esc(w.summary)}</p>`:''}${meta?`<div class="meta">${meta}</div>`:''}</div>`
    +(w.type==='攝影影音'?'':`<div class="cover">${w.cover?`<img src="${esc(w.cover)}" alt="${esc(w.title)}" fetchpriority="high" decoding="async">`:''}</div>`)  // 攝影類作品：封面圖已經排在內文裡，頁首不重複顯示
    +`<div class="prose">${w.contentHtml||''}</div>`
    +(w.video?`<div class="act" style="display:block"><div class="video"><iframe src="${esc(w.video)}" loading="lazy" allowfullscreen title="影片"></iframe></div></div>`:'')
    +`<div class="act">${w.link?`<a class="btn" href="${esc(w.link)}" target="_blank" rel="noopener noreferrer">前往網站</a>`:''}<a class="btn" href="/#works" style="background:var(--gt);color:var(--head)">看更多作品</a></div>`;
}
const fail=t=>{$('#app').innerHTML=`<div class="msg"><p>${t}</p><a class="btn" href="/#works">回到作品列表</a></div>`};

// ===== 燈箱：點內文圖片放大，左右鍵 / 滑動切換，Esc 或點空白處關閉 =====
const lb=$('#lb'),lbImg=lb.querySelector('.lb-f img'),lbCap=lb.querySelector('figcaption'),lbCnt=lb.querySelector('.lb-c');
let lbList=[],lbCur=0,lbFrom=null,lbOn=false;
const lbItems=()=>[...document.querySelectorAll('.prose img')];
function lbPrep(){                                          // 讓圖片可以用鍵盤開啟
  lbItems().forEach(i=>{i.tabIndex=0;i.setAttribute('role','button');i.setAttribute('aria-label',(i.alt||'圖片')+'（放大檢視）')});
}
function lbShow(i){
  lbCur=(i+lbList.length)%lbList.length;
  const el=lbList[lbCur];
  lbImg.src=el.currentSrc||el.src;lbImg.alt=el.alt||'';
  lbCap.textContent=(el.closest('figure')?.querySelector('figcaption')?.textContent||el.alt||'').trim();
  lbCnt.textContent=lbList.length>1?`${lbCur+1} / ${lbList.length}`:'';
  if(lbList.length>1)[1,-1].forEach(d=>{const n=lbList[(lbCur+d+lbList.length)%lbList.length];new Image().src=n.currentSrc||n.src}); // 預先載入前後一張
}
function lbOpen(i,from){
  lbList=lbItems();if(!lbList.length)return;
  lbFrom=from||null;
  lb.querySelectorAll('.lb-p,.lb-nx').forEach(b=>b.hidden=lbList.length<2);
  lbOn=true;lb.hidden=false;document.documentElement.style.overflow='hidden';
  lbShow(i);requestAnimationFrame(()=>{if(lbOn)lb.classList.add('on')});
  lb.querySelector('.lb-x').focus();
}
function lbClose(){
  lbOn=false;lb.classList.remove('on');document.documentElement.style.overflow='';
  setTimeout(()=>{if(!lbOn){lb.hidden=true;lbImg.removeAttribute('src')}},250);
  if(lbFrom)lbFrom.focus();
}
$('#app').addEventListener('click',e=>{const im=e.target.closest('.prose img');if(im){lbOpen(lbItems().indexOf(im),im)}});
lb.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('.lb-p'))lbShow(lbCur-1);
  else if(t.closest('.lb-nx'))lbShow(lbCur+1);
  else if(t.closest('.lb-x')||(!t.closest('img')&&!t.closest('figcaption')))lbClose();
});
addEventListener('keydown',e=>{
  if(lb.hidden){const t=e.target;if((e.key==='Enter'||e.key===' ')&&t.matches&&t.matches('.prose img')){e.preventDefault();lbOpen(lbItems().indexOf(t),t)}return}
  if(e.key==='Escape')lbClose();
  else if(e.key==='ArrowLeft')lbShow(lbCur-1);
  else if(e.key==='ArrowRight')lbShow(lbCur+1);
  else if(e.key==='Tab'){                                   // 焦點鎖在燈箱內
    const f=[...lb.querySelectorAll('button')].filter(b=>!b.hidden),a=document.activeElement;
    if(e.shiftKey&&a===f[0]){e.preventDefault();f[f.length-1].focus()}
    else if(!e.shiftKey&&a===f[f.length-1]){e.preventDefault();f[0].focus()}
  }
});
let lbX=null,lbY=0;
lb.addEventListener('touchstart',e=>{if(e.touches.length===1){lbX=e.touches[0].clientX;lbY=e.touches[0].clientY}else lbX=null},{passive:true});
lb.addEventListener('touchend',e=>{
  if(lbX===null||(window.visualViewport&&visualViewport.scale>1.05))return;   // 放大中不切換
  const t=e.changedTouches[0],dx=t.clientX-lbX,dy=t.clientY-lbY;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5)lbShow(lbCur+(dx<0?1:-1));
},{passive:true});

(async()=>{
  const el=document.getElementById('work-data');           // Worker 已經把作品資料放進頁面
  let w=null;try{w=el?JSON.parse(el.textContent):null}catch(e){}
  if(w&&w.notFound)return fail('找不到這個作品');
  if(!w&&slug){
    try{const r=await fetch(`${API}/api/works/${encodeURIComponent(slug)}`);
      if(r.status===404)return fail('找不到這個作品');
      if(!r.ok)throw new Error(r.status);w=await r.json()}catch(e){return fail('作品暫時載入失敗，請稍後再試')}
  }
  w?(show(w),lbPrep()):fail('找不到這個作品');
})();
new IntersectionObserver(es=>$('#fl').classList.toggle('hide',es[0].isIntersecting)).observe($('#contact'));
</script>
</body>
</html>
